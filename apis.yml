x-status-detail: 'No first-party host resolves or serves for Aipingji. The only domain any source ties
  to the company — apin.com, named as its operating site on its CB Insights profile — is now a domain-broker
  holding page: http://apin.com/ returns an ename.com.cn "This domain is for sale" lander (¥199,999 一口价)
  and every other path under it, including /.well-known/agent-card.json, /openapi.json and /robots.txt,
  returns 403; HTTPS on that host does not complete a connection. aipingji.com, aipingji.cn, aipinji.com
  and api.aipingji.com do not resolve at all. The www.belephtro.com string carried as "official website"
  on the 36Kr PitchHub record resolves but never answers on port 80 or 443 and is not a plausible first-party
  brand host, so it was not wired as a Website pointer. The EquityZen secondary-market listing this record
  was harvested from is live and still describes this company, but a trading-venue listing page is not
  a company web presence, so it is recorded here as type SecondaryMarket rather than type Website.'
